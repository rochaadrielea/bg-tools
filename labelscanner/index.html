<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>WAE Label Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0E1116; --panel:#161B22; --panel-2:#1C232D; --line:#2A3441;
    --ink:#E8EDF2; --ink-dim:#8B98A8; --signal:#35E0A1; --warn:#FFB454; --bad:#FF6B6B;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  header{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  header .tag{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--bg);background:var(--signal);padding:3px 7px;border-radius:3px;font-weight:700;}
  header h1{font-size:15px;font-weight:600;margin:0;}
  header .ver{font-family:var(--mono);font-size:10px;color:var(--ink-dim);border:1px solid var(--line);border-radius:10px;padding:2px 7px;}
  header .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
  header .count b{color:var(--signal);font-size:15px;}
  .wrap{padding:12px;max-width:640px;margin:0 auto;}

  .banner{border-radius:10px;padding:11px 13px;margin:0 0 12px;font-size:13px;line-height:1.45;display:none;}
  .banner.show{display:block;}
  .banner.bad{background:rgba(255,107,107,.12);border:1px solid var(--bad);color:#FFC9C9;}
  .banner.warn{background:rgba(255,180,84,.10);border:1px solid var(--warn);color:#FFDCA8;}
  .banner b{color:#fff;}

  .stage{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:3/4;max-height:56vh;margin:0 auto;}
  video{width:100%;height:100%;object-fit:cover;display:block;}
  .reticle{position:absolute;inset:14% 8%;border:2px solid var(--signal);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.32);pointer-events:none;opacity:.9;transition:border-color .2s;}
  .reticle.hit{border-color:#fff;}
  .reticle.partial{border-color:var(--warn);}
  .reticle.reject{border-color:var(--bad);}
  .reticle::before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--signal),transparent);animation:sweep 2.2s ease-in-out infinite;}
  @keyframes sweep{0%,100%{top:3%}50%{top:95%}}
  @media (prefers-reduced-motion:reduce){.reticle::before{animation:none;top:50%}}

  .splash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:5;padding:0 16px;text-align:center;}
  .splash.show{display:flex;}
  .splash.ok{background:rgba(53,224,161,.90);}
  .splash.no{background:rgba(255,107,107,.93);}
  .splash .mark{font-size:66px;line-height:1;font-weight:700;}
  .splash .what{font-family:var(--mono);font-weight:700;font-size:14px;}
  .splash.ok .mark,.splash.ok .what{color:#08130E;}
  .splash.no .mark,.splash.no .what{color:#2A0808;}

  .idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0B0E13;padding:24px;text-align:center;z-index:4;}
  .idle.hide{display:none;}
  .idle p{margin:0;color:var(--ink-dim);font-size:13px;line-height:1.5;max-width:320px;}
  .idle button{padding:15px 26px;}

  .status{position:absolute;left:10px;right:10px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--ink);background:rgba(14,17,22,.80);backdrop-filter:blur(6px);padding:7px 10px;border-radius:8px;border:1px solid var(--line);}
  .status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-dim);margin-right:7px;vertical-align:1px;}
  .status.live .dot{background:var(--signal);box-shadow:0 0 8px var(--signal);}
  .status.busy .dot{background:var(--warn);}
  .status.hit .dot{background:#fff;box-shadow:0 0 8px #fff;}
  .status.bad .dot{background:var(--bad);box-shadow:0 0 8px var(--bad);}

  .camtools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3;}
  .chip{font-family:var(--mono);font-size:12px;color:var(--ink);background:rgba(14,17,22,.7);border:1px solid var(--line);border-radius:20px;padding:7px 12px;backdrop-filter:blur(6px);cursor:pointer;user-select:none;}
  .chip.on{background:var(--signal);color:#08130E;border-color:var(--signal);}
  .zoomwrap{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(14,17,22,.7);border:1px solid var(--line);border-radius:20px;padding:4px 12px;backdrop-filter:blur(6px);}
  .zoomwrap span{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}
  input[type=range]{width:100px;accent-color:var(--signal);}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
  button{font-family:var(--sans);font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:14px;border-radius:11px;cursor:pointer;transition:transform .05s,background .15s;}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.4;}
  button.primary{background:var(--signal);color:#08130E;border-color:var(--signal);}
  button.ghost{background:transparent;}
  button.wide{grid-column:1/-1;}
  input[type=file]{display:none;}

  .masterline{font-family:var(--mono);font-size:11px;color:var(--ink-dim);text-align:center;margin:2px 0 10px;}
  .masterline b{color:var(--signal);}
  .masterline.off b{color:var(--warn);}

  .review{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 4px 10px;margin:12px 0;display:none;}
  .review.show{display:block;}
  .review.alarm{border-color:var(--bad);}
  .review h2{font-size:12px;font-family:var(--mono);letter-spacing:1px;color:var(--ink-dim);margin:12px 14px 8px;text-transform:uppercase;}
  .rnote{margin:0 10px 10px;padding:10px 12px;border-radius:9px;font-size:13px;line-height:1.45;display:none;}
  .rnote.show{display:block;}
  .rnote.bad{background:rgba(255,107,107,.12);border:1px solid var(--bad);color:#FFC9C9;}
  .rnote.warn{background:rgba(255,180,84,.10);border:1px solid var(--warn);color:#FFDCA8;}
  .fields{display:grid;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 10px;}
  .field{display:grid;grid-template-columns:104px 1fr;align-items:center;background:var(--panel-2);}
  .field label{font-family:var(--mono);font-size:11px;color:var(--ink-dim);padding:0 0 0 12px;}
  .field input{font-family:var(--mono);font-size:14px;color:var(--ink);background:transparent;border:none;padding:12px;width:100%;outline:none;}
  .field input:focus{background:rgba(53,224,161,.07);}
  .field.src-bc label::after{content:" \25AA";color:var(--signal);}
  .field.src-ocr label::after{content:" \25AA";color:var(--warn);}
  .field.flagged input{color:var(--warn);}
  .field.rejected input{color:var(--bad);}
  .legend{font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin:8px 14px 0;line-height:1.6;}
  .legend .g{color:var(--signal);}.legend .o{color:var(--warn);}

  .tablewrap{margin:8px 0 96px;border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;}
  th{background:var(--panel-2);color:var(--ink-dim);text-align:left;padding:6px 8px;position:sticky;top:0;white-space:nowrap;font-size:11px;}
  td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;font-size:11px;}
  tr:nth-child(even) td{background:rgba(255,255,255,.015);}
  td.del{color:var(--bad);cursor:pointer;text-align:center;width:34px;}
  td.flag{color:var(--warn);}
  .empty{color:var(--ink-dim);font-family:var(--mono);font-size:12px;text-align:center;padding:22px;}

  .exportbar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);display:flex;gap:10px;max-width:640px;margin:0 auto;}
  .exportbar button{flex:1;}
</style>
</head>
<body>
<header>
  <span class="tag">WAE</span><h1>Label Scanner</h1>
  <span class="ver" id="ver"></span>
  <span class="count"><b id="cnt">0</b> rows</span>
</header>

<div class="wrap">
  <div class="banner" id="banner"></div>

  <div class="stage">
    <video id="vid" playsinline muted autoplay></video>
    <div class="reticle" id="reticle"></div>
    <div class="splash" id="splash"><div class="mark" id="splashMark"></div><div class="what" id="splashTxt"></div></div>
    <div class="camtools">
      <div class="chip on" id="autoChip">Auto-add</div>
      <div class="chip" id="torchChip" style="display:none;">Light</div>
      <div class="chip" id="ocrChip">Read text now</div>
      <div class="zoomwrap" id="zoomWrap" style="display:none;">
        <span>zoom</span><input type="range" id="zoom" min="1" max="5" step="0.1" value="1">
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statustxt">Camera off</span></div>
    <div class="idle" id="idle">
      <button class="primary" id="authBtn">Turn on camera</button>
      <p id="idleTxt">The browser will ask permission to use the camera. Nothing is uploaded &mdash; frames are read on this device and discarded.</p>
    </div>
  </div>

  <div class="masterline" id="masterLine">Checking master list&hellip;</div>

  <div class="controls">
    <button class="ghost" id="fileBtn">Upload photo</button>
    <button class="ghost" id="focusBtn">Refocus</button>
    <button class="ghost wide" id="freshBtn">Get latest version (fresh reload)</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <div class="review" id="review">
    <h2>Review &amp; confirm</h2>
    <div class="rnote" id="rnote"></div>
    <div class="fields" id="fields"></div>
    <div class="legend">
      <span class="g">&#9642;</span> from barcode &nbsp; <span class="o">&#9642;</span> from OCR &mdash; check the amber ones
    </div>
    <div class="controls" style="margin:12px 10px 4px;">
      <button class="ghost" id="discardBtn">Discard</button>
      <button class="primary" id="addBtn">Add row</button>
    </div>
  </div>

  <div class="tablewrap">
    <table id="tbl"><thead><tr id="head"></tr></thead>
    <tbody id="body"><tr><td class="empty" colspan="14">No rows yet.</td></tr></tbody></table>
  </div>
</div>

<div class="exportbar">
  <button id="clearBtn" class="ghost">Clear all</button>
  <button id="exportBtn" class="primary">Export .xlsx</button>
</div>

<script>
// ============================================================================
//  WAE LABEL SCANNER  v5.0
//  ---------------------------------------------------------------------------
//  WHAT CHANGED FROM v4.2, AND WHY IT MATTERED
//
//  v4.2 kept every field it had ever read in one global `found` object that was
//  cleared only when a row was written. Read the batch off label A, fail to get
//  its material, move to label B, catch B's material -> the two combined into
//  one row and auto-added. Material B with batch A. A wrong pairing is worse
//  than no read at all: it is a false traceability record.
//
//  v5.0 replaces that with a LABEL SESSION. Evidence belongs to one physical
//  label, is timestamped, expires on its own, and a row is only written
//  automatically when the mandatory fields can be PROVEN to come from the same
//  label. Where proof is unavailable the row goes to review instead, and the
//  reason is recorded in the exported audit columns.
//
//  Tuning lives in three places and nowhere else:
//    applyBarcodes()  barcode -> field rules   (green dot)
//    parseOcr()       printed text -> field    (amber dot)
//    the CONSTANTS block below
// ============================================================================

const VERSION = 'v5.1';
document.getElementById('ver').textContent = VERSION;

// ---- constants --------------------------------------------------------------
// IDLE_MS      no new evidence for this long -> the part-read label is thrown
//              away. This is the setting that stops values crossing labels.
// COHERENCE_MS two fields further apart in time than this are not assumed to
//              be from the same label.
// BOX_SPANS    two barcodes count as being on one label when their centres are
//              within this many barcode-diagonals of each other.
// GRACE_MS     after the mandatory fields land, keep reading this long so the
//              rest of the same label lands in the same row.
const IDLE_MS = 2500;
const COHERENCE_MS = 900;
const BOX_SPANS = 2.5;
const GRACE_MS = 800;
const NEED_VOTES = 2;

const COLS = ["Mat","Definition","Rev","SerNr","Char","L-Char","Auftr","Menge","Einheit","Verfallsdatum","CH-Nr"];
const AUDIT_COLS = ["Source","Proof","Check"];
const ALL_COLS = COLS.concat(AUDIT_COLS);
const MANDATORY = ["Mat","Char"];
const STORE_KEY = 'wae_label_rows_v5';

const rows = loadRows();
let current = null;
function loadRows(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||[] }catch(_){ return [] } }
function saveRows(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(rows)) }catch(_){} }

const vid=document.getElementById('vid');
const statusEl=document.getElementById('status'), statusTxt=document.getElementById('statustxt');
const reticle=document.getElementById('reticle'), banner=document.getElementById('banner');
const idlePanel=document.getElementById('idle'), authBtn=document.getElementById('authBtn'), idleTxt=document.getElementById('idleTxt');
const fileBtn=document.getElementById('fileBtn'), focusBtn=document.getElementById('focusBtn'), fileInput=document.getElementById('fileInput');
const ocrChip=document.getElementById('ocrChip'), torchChip=document.getElementById('torchChip'), autoChip=document.getElementById('autoChip');
const zoomWrap=document.getElementById('zoomWrap'), zoom=document.getElementById('zoom');
const review=document.getElementById('review'), fieldsEl=document.getElementById('fields'), rnote=document.getElementById('rnote');
const addBtn=document.getElementById('addBtn'), discardBtn=document.getElementById('discardBtn');
const exportBtn=document.getElementById('exportBtn'), clearBtn=document.getElementById('clearBtn');
const masterLine=document.getElementById('masterLine');

function setStatus(t,c){ statusTxt.textContent=t; statusEl.className='status'+(c?' '+c:''); }
function showBanner(html,kind){ banner.innerHTML=html; banner.className='banner show '+(kind||'warn'); }

document.getElementById('freshBtn').addEventListener('click', async()=>{
  try{ if(window.caches){ const k=await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); } }catch(_){}
  try{ if(navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); } }catch(_){}
  location.href = location.pathname + '?fresh=' + Date.now();
});

// ============================================================================
//  MASTER LIST
//  data/master.json, generated by make_master.py from the Teamcenter BOMs.
//  Absent or unreadable -> the scanner still works, validation switches off and
//  says so. It must never be the reason a label cannot be scanned.
// ============================================================================
//  THE MASTER CHECKS MATERIAL NUMBERS ONLY, AND ALWAYS WILL.
//  A batch is assigned by the production order at build time. No BOM states
//  which batch was consumed, so a batch can never be validated against a
//  material from design data - any such check would reject every new batch.
//  A correct batch therefore depends entirely on reading the right label and
//  proving the values came off it. That is what the reticle gate, the conflict
//  check and the label session below are for.
let MASTER = null;
const matIndex = new Map();     // normalised material -> entry
const designOnly = new Set();

function normId(v){
  if(v===null||v===undefined) return '';
  let s = String(v).trim();
  if(/^\d+\.0$/.test(s)) s = s.slice(0,-2);
  return s.toUpperCase();
}

async function loadMaster(){
  try{
    const res = await fetch('data/master.json?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    MASTER = await res.json();
    (MASTER.materials||[]).forEach(m=>matIndex.set(normId(m.material), m));
    (MASTER.design_only||[]).forEach(m=>designOnly.add(normId(m)));
    const mode = MASTER.mode==='strict' ? 'strict' : 'warn';
    MASTER.mode = mode;
    masterLine.className = 'masterline';
    masterLine.innerHTML = 'master list <b>'+matIndex.size+'</b> materials &middot; mode <b>'+mode+'</b>';
  }catch(e){
    masterLine.className = 'masterline off';
    masterLine.innerHTML = 'master list <b>not loaded</b> &mdash; values are not checked';
    console.warn('master.json:', e);
  }
}

// A material is known / design-only / unknown. In warn mode an unknown material
// is flagged and kept; in strict mode it blocks the row. The batch is never
// judged here - see the note above.
function checkAgainstMaster(mat){
  if(!MASTER) return {level:'none', flags:[]};
  const m = normId(mat);
  if(!m || matIndex.has(m)) return {level:'ok', flags:[]};
  if(designOnly.has(m)) return {level:'warn', flags:['design-only material']};
  return {
    level: MASTER.mode==='strict' ? 'reject' : 'warn',
    flags: ['material not in master']
  };
}

// ============================================================================
//  LABEL SESSION
//  One session = one physical label. Every field carries when it was read and,
//  where the browser gave us one, where in the frame it was read.
// ============================================================================
let session = newSession();
function newSession(){ return {fields:{}, startedAt:0, lastAt:0, votes:{}, conflict:null}; }

function resetSession(reason){
  const had = Object.keys(session.fields).length;
  session = newSession();
  reticle.classList.remove('partial','reject');
  if(had && reason) setStatus(reason,'live');
}

// Record one field. `box` and `tick` are optional; when the decoder cannot tell
// us where in the frame the code was, we say so rather than assume.
function put(field, value, src, box, tick){
  if(!value) return false;
  const now = Date.now();
  const prev = session.fields[field];
  // a barcode is never overwritten by OCR
  if(prev && prev.src==='bc' && src!=='bc') return false;
  if(prev && prev.value===value){ prev.t=now; session.lastAt=now; return false; }
  // TWO BARCODES, SAME FIELD, DIFFERENT VALUES.
  // Before v5.1 the newer one silently replaced the older, which is exactly how
  // one label's value ends up on another label's row. It is not a better read -
  // it is evidence that more than one label is being seen. Keep the first,
  // record the disagreement, and let evaluate() send it to review.
  if(prev && prev.src==='bc' && src==='bc'){
    session.conflict = {field:field, kept:prev.value, other:value};
    session.lastAt = now;
    return true;
  }
  if(!session.startedAt) session.startedAt = now;
  session.fields[field] = {value:value, src:src, t:now, box:box||null, tick:(tick||0)};
  session.lastAt = now;
  return true;
}

// Idle sweep. This is what stops a half-read label from waiting around to
// contaminate the next one.
setInterval(function(){
  if(!scanning) return;
  if(!session.lastAt) return;
  if(Date.now() - session.lastAt < IDLE_MS) return;
  if(review.classList.contains('show')) return;   // user is editing, leave it
  if(Object.keys(session.fields).length){
    resetSession('Part-read label cleared \u2014 start again');
  }
}, 400);

// ---- the reticle is a GATE, not decoration ---------------------------------
// Until v5.1 the green box meant nothing: a barcode anywhere in frame was read.
// With two labels side by side the detector returned both in ONE detect() call,
// so they shared a frame tick and passed as "same-frame" - the strongest proof
// the scanner has - while actually being two different labels. Aiming now
// decides what gets read.
//
// The video is drawn with object-fit:cover, so the element crops the frame.
// This converts the reticle's on-screen rectangle back into video pixels.
const RET_INSET_X = 0.08, RET_INSET_Y = 0.14;   // must match .reticle CSS inset

function reticleRectInVideo(){
  const vw = vid.videoWidth, vh = vid.videoHeight;
  if(!vw || !vh) return null;
  const W = vid.clientWidth, H = vid.clientHeight;
  if(!W || !H) return null;
  const scale = Math.max(W/vw, H/vh);          // cover
  const offX = (vw*scale - W)/2, offY = (vh*scale - H)/2;
  const toVid = (sx,sy)=>({x:(sx+offX)/scale, y:(sy+offY)/scale});
  const a = toVid(W*RET_INSET_X, H*RET_INSET_Y);
  const b = toVid(W*(1-RET_INSET_X), H*(1-RET_INSET_Y));
  return {x1:a.x, y1:a.y, x2:b.x, y2:b.y};
}

// true inside, false outside, null when we cannot tell (no box from the
// decoder). Null must not be treated as inside - it is recorded instead.
function insideReticle(box){
  if(!box) return null;
  const r = reticleRectInVideo();
  if(!r) return null;
  const cx = box.x + box.width/2, cy = box.y + box.height/2;
  return cx >= r.x1 && cx <= r.x2 && cy >= r.y1 && cy <= r.y2;
}

function boxesCohere(a,b){
  if(!a||!b) return null;                 // unknown, not false
  const ca={x:a.x+a.width/2, y:a.y+a.height/2};
  const cb={x:b.x+b.width/2, y:b.y+b.height/2};
  const d = Math.hypot(ca.x-cb.x, ca.y-cb.y);
  const span = Math.max(Math.hypot(a.width,a.height), Math.hypot(b.width,b.height));
  return d <= span * BOX_SPANS;
}

// Can we PROVE the mandatory fields came off one label?
//   same-frame  strongest: both codes in a single detection
//   near        different frames, close in time, boxes agree
//   time-only   close in time but no position available (ZXing / OCR)
//   split       too far apart in time, or boxes disagree -> no auto-add
function proveSameLabel(){
  const f = MANDATORY.map(function(k){ return session.fields[k]; });
  if(f.some(function(x){ return !x; })) return {ok:false, kind:'incomplete'};
  const a=f[0], b=f[1];
  if(a.tick && b.tick && a.tick===b.tick) return {ok:true, kind:'same-frame'};
  if(Math.abs(a.t-b.t) > COHERENCE_MS) return {ok:false, kind:'split'};
  const co = boxesCohere(a.box, b.box);
  if(co === true) return {ok:true, kind:'near'};
  if(co === false) return {ok:false, kind:'split'};
  return {ok:true, kind:'time-only'};
}

// ============================================================================
//  CAMERA  (user-authorised, never auto-started)
// ============================================================================
let stream=null, track=null, scanning=false, codeReader=null, frameTick=0;
let nativeDetector=null, autoMode=true, lastBeep=0, ocrBusy=false, worker=null;

const hints = new Map();
hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
  ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
  ZXing.BarcodeFormat.DATA_MATRIX, ZXing.BarcodeFormat.QR_CODE,
  ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.ITF
]);
try{
  if('BarcodeDetector' in window){
    nativeDetector = new BarcodeDetector({formats:['code_128','code_39','data_matrix','qr_code','itf','ean_13']});
  }
}catch(_){ nativeDetector = null; }

// Browsers refuse the camera outside a secure context. Say that plainly up
// front instead of letting the user think the scanner is broken.
function secureContextOk(){
  return window.isSecureContext
      || location.protocol === 'https:'
      || ['localhost','127.0.0.1'].indexOf(location.hostname) >= 0;
}

if(!secureContextOk()){
  showBanner('This page is on <b>http://</b>, and browsers only allow camera access '
    + 'over <b>https://</b>. The table, photo upload and export all work here; live '
    + 'scanning does not. Use the https address for scanning.', 'bad');
  idleTxt.innerHTML = 'Camera is unavailable on this address. <b>Upload photo</b> still works.';
}

authBtn.addEventListener('click', startCamera);

async function startCamera(){
  stopCamera();
  try{
    setStatus('Starting camera\u2026','busy');
    idlePanel.classList.add('hide');
    if(nativeDetector){
      stream = await navigator.mediaDevices.getUserMedia(
        {video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
      vid.srcObject = stream; await vid.play();
      track = stream.getVideoTracks()[0]; if(track) setupCapabilities();
      scanning = true; nativeLoop();
    } else {
      codeReader = new ZXing.BrowserMultiFormatReader(hints, 200);
      await codeReader.decodeFromConstraints(
        {video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false},
        vid,
        function(result){ if(result && result.getText) onCodes([{value:result.getText().trim(), box:null}]); }
      );
      scanning = true;
      stream = vid.srcObject;
      track = stream ? stream.getVideoTracks()[0] : null;
      if(track) setupCapabilities();
    }
    authBtn.textContent = 'Restart camera';
    setStatus('Point at a label','live');
  }catch(e){
    idlePanel.classList.remove('hide');
    console.error(e);
    const denied = e && (e.name==='NotAllowedError' || e.name==='SecurityError');
    setStatus(denied ? 'Camera permission refused' : 'Camera unavailable','bad');
    if(denied){
      showBanner('Camera permission was refused. Allow it in the padlock menu next to '
        + 'the address, then press <b>Turn on camera</b> again.', 'bad');
    } else if(secureContextOk()){
      showBanner('Could not open the camera. Another app may be holding it. '
        + '<b>Upload photo</b> works meanwhile.', 'warn');
    }
  }
}

function stopCamera(){
  scanning = false;
  try{ if(codeReader) codeReader.reset(); }catch(_){}
  if(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(_){} stream=null; }
}

// ~12 checks a second. The native detector returns EVERY barcode in the frame
// with its position, which is what lets us prove two codes share a label.
// v4.2 also ran Tesseract in a parallel while-loop; on a phone each pass takes
// seconds and starved this loop of CPU, which is why reads were being missed.
// OCR is now only ever run on demand.
async function nativeLoop(){
  while(scanning){
    try{
      if(vid.videoWidth){
        const codes = await nativeDetector.detect(vid);
        if(codes && codes.length){
          frameTick++;
          const tick = frameTick;
          onCodes(codes.map(function(c){
            return {value:(c.rawValue||'').trim(), box:c.boundingBox||null};
          }), tick);
        }
      }
    }catch(_){}
    await new Promise(function(r){ setTimeout(r,80); });
  }
}

function setupCapabilities(){
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if(caps.zoom){
    zoom.min=caps.zoom.min; zoom.max=caps.zoom.max; zoom.step=caps.zoom.step||0.1; zoom.value=caps.zoom.min;
    zoomWrap.style.display='flex';
    zoom.oninput=function(){ track.applyConstraints({advanced:[{zoom:parseFloat(zoom.value)}]}).catch(function(){}); };
  } else zoomWrap.style.display='none';
  if(caps.torch){
    torchChip.style.display='block'; let on=false;
    torchChip.onclick=function(){ on=!on; torchChip.classList.toggle('on',on);
      track.applyConstraints({advanced:[{torch:on}]}).catch(function(){}); };
  } else torchChip.style.display='none';
}

let pinchStart=0, zoomStart=1;
vid.addEventListener('touchstart',function(e){ if(e.touches.length===2){ pinchStart=dist(e.touches); zoomStart=parseFloat(zoom.value)||1; } },{passive:true});
vid.addEventListener('touchmove',function(e){ if(e.touches.length===2 && zoomWrap.style.display!=='none'){ e.preventDefault();
  const f=dist(e.touches)/pinchStart;
  const z=Math.min(parseFloat(zoom.max),Math.max(parseFloat(zoom.min),zoomStart*f));
  zoom.value=z; track.applyConstraints({advanced:[{zoom:z}]}).catch(function(){}); } },{passive:false});
function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }

focusBtn.addEventListener('click',function(){ if(!track) return;
  track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(function(){});
  setStatus('Refocusing\u2026','busy'); setTimeout(function(){ setStatus('Point at a label','live'); },700);
});

autoChip.addEventListener('click',function(){ autoMode=!autoMode; autoChip.classList.toggle('on',autoMode);
  setStatus(autoMode?'Auto-add on':'Manual \u2014 review every label','live'); });

// ============================================================================
//  BARCODE RULES
//  Order matters and is deliberate: most specific first. In v4.2 the loose Mat
//  pattern was tested before the L-Char pattern, so a 10-digit L-Char barcode
//  matched Mat first and was filed as the material number.
// ============================================================================
function applyBarcodes(codes, tick){
  let changed = false;
  let ignored = 0;
  for(const c of codes){
    const s = (c.value||'').trim(); if(!s) continue;
    const box = c.box;

    // aim gate: a code sitting outside the green box belongs to a label the
    // operator is not pointing at. null = decoder gave no position, so the
    // gate cannot be applied and the code is allowed through.
    if(insideReticle(box) === false){ ignored++; continue; }

    // CH-884843 -> CH-Nr, and the digits are the Char
    if(/^CH-?\d+$/i.test(s)){
      const n = s.replace(/^CH-?/i,'');
      changed = put('CH-Nr','CH-'+n,'bc',box,tick) || changed;
      changed = put('Char', n,'bc',box,tick) || changed;
      continue;
    }
    // EQ-labels: serialized parts. The EQ number is NOT the Char.
    if(/^EQ-?\d+$/i.test(s)){
      changed = put('CH-Nr', s.toUpperCase(),'bc',box,tick) || changed;
      continue;
    }
    // exactly 10 digits -> L-Char. Checked BEFORE the general material shape.
    if(/^\d{10}$/.test(s)){
      changed = put('L-Char', s,'bc',box,tick) || changed;
      continue;
    }
    // material: 1-2 letters + 4+ digits + optional suffix, or a bare 6-7 digit
    // number. A bare 8-9 or 11+ digit number is not a material on these labels.
    if(/^[A-Z]{1,2}\d{4,}[A-Z0-9-]{0,6}$/i.test(s) || /^\d{6,7}$/.test(s)){
      changed = put('Mat', s.toUpperCase(),'bc',box,tick) || changed;
      continue;
    }
  }
  if(ignored && !changed) setStatus(ignored+' code(s) outside the box \u2014 aim at one label','busy');
  return changed;
}

function onCodes(codes, tick){
  if(!applyBarcodes(codes, tick)) return;
  reticle.classList.add('hit');
  const now = Date.now(); if(now-lastBeep>400){ beep(); lastBeep=now; }
  setTimeout(function(){ reticle.classList.remove('hit'); },300);
  evaluate();
}

// ============================================================================
//  DECIDE WHAT TO DO WITH THE CURRENT SESSION
// ============================================================================
let graceTimer = null;

function evaluate(){
  const f = session.fields;

  // Two labels seen. Never auto-add; the operator decides which one is in hand.
  if(session.conflict){
    reticle.classList.add('reject');
    setStatus('Two different '+session.conflict.field+' codes seen \u2014 check','bad');
    openReview({ok:false, kind:'conflict'}, checkAgainstMaster(f['Mat'] ? f['Mat'].value : ''));
    return;
  }

  const hasAll = MANDATORY.every(function(k){ return f[k]; });

  if(!hasAll){
    reticle.classList.add('partial');
    const got = MANDATORY.filter(function(k){ return f[k]; });
    const miss = MANDATORY.filter(function(k){ return !f[k]; });
    if(got.length){
      setStatus(got.map(function(k){ return k+' '+f[k].value; }).join(' ')
                + ' \u2014 need ' + miss.join(', '), 'busy');
      // Mat from a barcode but no Char: on EQ labels the Char is printed text.
      if(f['Mat'] && !f['Char'] && autoMode && !ocrBusy) ocrBurst(false);
    }
    return;
  }

  reticle.classList.remove('partial');
  const proof = proveSameLabel();
  const chk = checkAgainstMaster(f['Mat'].value);

  if(chk.level === 'reject'){
    reticle.classList.add('reject');
    setStatus(chk.flags[0], 'bad');
    splashNo(chk.flags[0]);
    // Never write it and never keep it. Holding it is how the next label gets
    // poisoned - which is the bug this whole rebuild exists to prevent.
    setTimeout(function(){ resetSession('Rejected \u2014 scan the label again'); }, 1500);
    return;
  }

  if(!proof.ok){
    setStatus('Mat and Char may be from different labels \u2014 check', 'bad');
    openReview(proof, chk);
    return;
  }

  if(!autoMode){ openReview(proof, chk); return; }

  setStatus('Reading the rest of the label\u2026','busy');
  clearTimeout(graceTimer);
  graceTimer = setTimeout(function(){ commit(proof, chk); }, GRACE_MS);
}

function sourceLine(get){
  const bc = COLS.filter(function(c){ return get(c)==='bc'; });
  const oc = COLS.filter(function(c){ return get(c)==='ocr'; });
  return (bc.length ? 'barcode: '+bc.join(' ') : '')
       + (oc.length ? (bc.length?' | ':'') + 'ocr: '+oc.join(' ') : '');
}

function commit(proof, chk){
  const f = session.fields, row = {};
  COLS.forEach(function(c){ row[c] = f[c] ? f[c].value : ''; });
  row.Source = sourceLine(function(c){ return f[c] ? f[c].src : ''; });
  row.Proof  = proof ? proof.kind : 'manual';
  row.Check  = (chk && chk.flags.length) ? chk.flags.join('; ') : (MASTER ? 'ok' : 'not checked');
  rows.push(row); saveRows(); renderTable();
  splashOk(row.Mat + '  /  Char ' + row.Char, chk && chk.flags.length);
  beep(); setTimeout(beep,140);
  setTimeout(function(){ hideSplash(); resetSession(); setStatus('Row added \u2014 next label','live'); }, 900);
}

function splashOk(txt, flagged){
  document.getElementById('splash').className='splash ok show';
  document.getElementById('splashMark').textContent='\u2713';
  document.getElementById('splashTxt').textContent = txt + (flagged?'  \u2014 flagged, check it':'');
}
function splashNo(txt){
  document.getElementById('splash').className='splash no show';
  document.getElementById('splashMark').textContent='\u2715';
  document.getElementById('splashTxt').textContent = txt;
  setTimeout(hideSplash,1500);
}
function hideSplash(){ document.getElementById('splash').className='splash'; }

function beep(){ try{
  const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination);
  o.frequency.value=880; g.gain.value=.05; o.start(); setTimeout(function(){ o.stop(); a.close(); },90);
}catch(_){} }

// ============================================================================
//  OCR  (on demand only)
// ============================================================================
ocrChip.addEventListener('click', function(){ ocrBurst(true); });

async function ensureWorker(){
  if(!worker){
    setStatus('Loading text reader\u2026','busy');
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_pageseg_mode:'6'});
  }
  return worker;
}

// A value only becomes a mandatory field once two passes agree on it, so a
// single blurry misread cannot land in the table.
function vote(field, value){
  if(!value) return;
  const f = session.fields;
  if(f[field] && f[field].src==='bc') return;
  if(MANDATORY.indexOf(field) < 0){ if(!f[field]) put(field,value,'ocr',null,0); return; }
  session.votes[field] = session.votes[field] || {};
  session.votes[field][value] = (session.votes[field][value]||0)+1;
  if(session.votes[field][value] >= NEED_VOTES) put(field,value,'ocr',null,0);
}

async function ocrBurst(manual){
  if(!vid.videoWidth){ setStatus('Turn the camera on first','busy'); return; }
  if(ocrBusy) return;
  ocrBusy = true;
  try{
    await ensureWorker();
    setStatus('Reading text \u2014 hold steady\u2026','busy');
    for(let i=0;i<3;i++){
      const out = await worker.recognize(cropForOcr(vid));
      const p = parseOcr((out && out.data && out.data.text) || '');
      for(const k in p) vote(k, p[k]);
      await new Promise(function(r){ setTimeout(r,150); });
    }
  }catch(e){ console.warn(e); }
  ocrBusy = false;
  if(manual) openReview(proveSameLabel(), checkAgainstMaster(val('Mat')));
  else evaluate();
}
function val(k){ return session.fields[k] ? session.fields[k].value : ''; }

function cropForOcr(src){
  const w=src.videoWidth||src.width, h=src.videoHeight||src.height;
  const mx=Math.round(w*0.06), my=Math.round(h*0.10);
  const cw=w-2*mx, ch=h-2*my;
  const c=document.createElement('canvas');
  const sc=Math.min(1.8, 1600/Math.max(cw,ch));
  c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
  const ctx=c.getContext('2d');
  ctx.filter='grayscale(1) contrast(1.3)';
  ctx.drawImage(src,mx,my,cw,ch,0,0,c.width,c.height);
  return c;
}

function digitFix(v){ return v.replace(/O/g,'0').replace(/B/g,'8').replace(/S/g,'5').replace(/[Il]/g,'1'); }

function parseOcr(text){
  const j = text.split(/\n/).map(function(l){ return l.trim(); }).filter(Boolean).join('\n');
  const out = {};
  const g = function(re){ const m = j.match(re); return m ? m[1].trim() : ''; };
  let def = g(/Mat\.?\s*[A-Z0-9-]+\s*\n\s*([A-Z][A-Z0-9 ,.\/-]{3,})/);
  if(!def){
    const L = j.split('\n');
    def = L.find(function(l){
      return /^[A-Z][A-Z0-9 ,.\/-]{4,}$/.test(l) && !/GRAVITY|SCHWEIZ|BEYOND|PNF|LNR/i.test(l);
    }) || '';
  }
  if(def) out.Definition = def;
  let r;
  if(r=g(/Rev\.?\s*([A-Z])\b/)) out.Rev=r;
  if(r=g(/SerNr\.?\s*(\d{2,})/)) out.SerNr=r;
  if(r=g(/(?:^|\n)\s*[CG]?ha[rl]?\.?\s*[:.]?\s*([0-9OBSIl]{5,7})\b/)) out.Char=digitFix(r);
  if(r=g(/L-?[CG]?ha[rl]?\.?\s*[:.]?\s*([0-9OBSIl]{4,})/)) out['L-Char']=digitFix(r);
  if(r=g(/Mat\.?\s*[:.]?\s*([A-Z]{0,2}\d{4,}[A-Z0-9-]{0,6})/i)) out.Mat=r.toUpperCase();
  if(r=g(/Menge:?\s*\n?\s*(\d{3,})/)) out.Auftr=r;
  if(r=g(/(\d+\.\d{3})\b/)) out.Menge=r;
  if(r=g(/\b(ST|PCS|KG|M)\b/)) out.Einheit=r;
  if(r=g(/Verfallsdatum:?\s*(\d{2}\.\d{2}\.\d{4})/)) out.Verfallsdatum=r;
  if(r=g(/(CH-?\d{5,})/)) out['CH-Nr'] = r.replace(/^CH-?/,'CH-');
  if(r=g(/(EQ-?\d{5,})/)) out['CH-Nr'] = out['CH-Nr'] || r;
  return out;
}

// ============================================================================
//  UPLOAD  (works with no camera, so it also works on http://)
// ============================================================================
fileBtn.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  resetSession();
  const img = new Image();
  img.onload = async function(){
    setStatus('Reading photo\u2026','busy');
    const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    // one still = one label, so everything read here shares a tick
    const tick = ++frameTick;
    for(const deg of [0,90,180,270]){
      try{
        const rc = rotateCanvas(c,deg);
        const el = new Image(); el.src = rc.toDataURL('image/png');
        await el.decode().catch(function(){});
        const rd = new ZXing.BrowserMultiFormatReader();
        const res = await rd.decodeFromImageElement(el).catch(function(){ return null; });
        if(res && res.text) applyBarcodes([{value:res.text.trim(), box:null}], tick);
      }catch(_){}
    }
    try{
      await ensureWorker();
      const out = await worker.recognize(upscale(c));
      const p = parseOcr((out && out.data && out.data.text) || '');
      for(const k in p) if(!session.fields[k]) put(k,p[k],'ocr',null,tick);
    }catch(_){}
    openReview(proveSameLabel(), checkAgainstMaster(val('Mat')));
    setStatus(scanning?'Point at a label':'Photo read', scanning?'live':'');
  };
  img.src = URL.createObjectURL(file); fileInput.value='';
});

function upscale(src){
  const w=src.width, h=src.height;
  const c=document.createElement('canvas'); const sc=Math.min(2, 2200/Math.max(w,h)+0.001);
  c.width=w*sc; c.height=h*sc;
  const ctx=c.getContext('2d'); ctx.filter='grayscale(1) contrast(1.2)'; ctx.drawImage(src,0,0,c.width,c.height);
  return c;
}
function rotateCanvas(src,deg){
  if(deg===0) return src;
  const c=document.createElement('canvas'), ctx=c.getContext('2d');
  if(deg===180){ c.width=src.width; c.height=src.height; ctx.translate(c.width,c.height); ctx.rotate(Math.PI); }
  else { c.width=src.height; c.height=src.width; ctx.translate(c.width/2,c.height/2);
         ctx.rotate(deg*Math.PI/180); ctx.translate(-src.width/2,-src.height/2); }
  ctx.drawImage(src,0,0); return c;
}

// ============================================================================
//  REVIEW CARD
// ============================================================================
const PROOF_TEXT = {
  'same-frame':'Both codes were read in one camera frame.',
  'near':'Read moments apart, in the same place on the label.',
  'time-only':'Read moments apart. The browser could not tell us where on the label these came from, so this is not proven \u2014 check the two values belong together.',
  'split':'These values were read at different times or in different places. They may be from TWO DIFFERENT LABELS. Check before adding.',
  'conflict':'TWO DIFFERENT LABELS were seen. Move the other label out of view, point at one label only, and scan again.',
  'incomplete':'A mandatory value is missing.'
};

function openReview(proof, chk){
  current = {};
  ALL_COLS.forEach(function(c){
    const f = session.fields[c];
    current[c] = f ? {value:f.value, src:f.src} : {value:'', src:''};
  });
  current._proof = proof; current._chk = chk;

  const bad  = (chk && chk.level==='reject')
            || (proof && !proof.ok && (proof.kind==='split' || proof.kind==='conflict'));
  const warn = (chk && chk.level==='warn')   || (proof && proof.kind==='time-only');
  review.className = 'review show' + (bad?' alarm':'');

  const msgs = [];
  if(proof && PROOF_TEXT[proof.kind] && proof.kind!=='same-frame' && proof.kind!=='near')
    msgs.push(PROOF_TEXT[proof.kind]);
  if(session.conflict){
    msgs.push('Kept <b>'+session.conflict.field+' '+session.conflict.kept
      + '</b>; also saw <b>'+session.conflict.other+'</b>.');
  }
  if(chk && chk.flags.length) msgs.push(chk.flags.join('. '));
  if(msgs.length){ rnote.className = 'rnote show ' + (bad?'bad':'warn'); rnote.innerHTML = msgs.join('<br>'); }
  else rnote.className = 'rnote';

  fieldsEl.innerHTML='';
  COLS.forEach(function(col){
    const f = current[col];
    let cls = f.src==='bc' ? 'src-bc' : (f.src==='ocr' ? 'src-ocr' : '');
    if(chk && chk.level==='reject' && (col==='Mat'||col==='Char')) cls += ' rejected';
    else if(warn && (col==='Mat'||col==='Char')) cls += ' flagged';
    const row = document.createElement('div');
    row.className = 'field '+cls;
    row.innerHTML = '<label>'+col+'</label><input data-col="'+col+'" value="'
      + (f.value||'').replace(/"/g,'&quot;') + '" spellcheck="false">';
    fieldsEl.appendChild(row);
  });
  review.scrollIntoView({behavior:'smooth', block:'nearest'});
}

fieldsEl.addEventListener('input', function(e){
  const col = e.target.dataset.col;
  if(col && current) current[col].value = e.target.value;
});

// Hand-edited values are re-checked. Typing over a rejected pairing does not
// make it acceptable unless the corrected values actually agree.
addBtn.addEventListener('click', function(){
  if(!current) return;
  const chk = checkAgainstMaster(current['Mat'].value);
  if(chk.level==='reject'){
    rnote.className='rnote show bad';
    rnote.innerHTML = chk.flags.join('. ') + '<br>Correct the values before adding.';
    return;
  }
  const row = {};
  COLS.forEach(function(c){ row[c] = current[c].value; });
  row.Source = sourceLine(function(c){ return current[c].src; });
  row.Proof  = (current._proof ? current._proof.kind : 'manual') + ' (confirmed by user)';
  row.Check  = chk.flags.length ? chk.flags.join('; ') : (MASTER ? 'ok' : 'not checked');
  rows.push(row); saveRows(); renderTable();
  current=null; resetSession(); review.className='review';
  setStatus('Row added \u2014 next label','live');
});

discardBtn.addEventListener('click', function(){
  current=null; resetSession(); review.className='review';
  setStatus(scanning?'Point at a label':'Camera off', scanning?'live':'');
});

// ============================================================================
//  TABLE + EXPORT
// ============================================================================
function renderTable(){
  document.getElementById('cnt').textContent = rows.length;
  document.getElementById('head').innerHTML = '<th></th>'
    + ALL_COLS.map(function(c){ return '<th>'+c+'</th>'; }).join('');
  const body = document.getElementById('body');
  if(!rows.length){
    body.innerHTML = '<tr><td class="empty" colspan="'+(ALL_COLS.length+1)+'">No rows yet.</td></tr>';
    return;
  }
  body.innerHTML = rows.map(function(r,i){
    const flagged = r.Check && r.Check!=='ok' && r.Check!=='not checked';
    return '<tr><td class="del" data-i="'+i+'">&#10005;</td>' + ALL_COLS.map(function(c){
      const v = (r[c]||'').toString().replace(/</g,'&lt;');
      const cls = ((c==='Check' && flagged) || (c==='Proof' && /split|time-only/.test(r[c]||'')))
                  ? ' class="flag"' : '';
      return '<td'+cls+'>'+v+'</td>';
    }).join('') + '</tr>';
  }).join('');
}

document.getElementById('body').addEventListener('click', function(e){
  const i = e.target.dataset.i;
  if(i!==undefined){ rows.splice(+i,1); saveRows(); renderTable(); }
});

exportBtn.addEventListener('click', function(){
  if(!rows.length){ setStatus('Nothing to export yet'); return; }
  const ws = XLSX.utils.json_to_sheet(rows, {header: ALL_COLS});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Labels');
  XLSX.writeFile(wb, 'WAE_labels_' + new Date().toISOString().slice(0,10) + '.xlsx');
});

clearBtn.addEventListener('click', function(){
  if(confirm('Clear all rows?')){ rows.length=0; saveRows(); renderTable(); }
});

renderTable();
loadMaster();
</script>
</body>
</html>
