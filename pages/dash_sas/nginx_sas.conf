# Add inside the existing server { } block in
# /etc/nginx/sites-available/quality  (the one that already has /dashboard/ and /adab/).
# Then:  sudo nginx -t && sudo systemctl reload nginx
#
# FastAPI runs with root_path=/sas, so it emits correct /sas/... URLs behind this proxy.

location /sas/ {
    proxy_pass http://127.0.0.1:8503/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_read_timeout 86400;
}
location = /sas {
    return 301 /sas/;
}
